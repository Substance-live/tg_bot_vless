services:
  orchestrator:
    build: .
    image: vpn-orchestrator:latest
    container_name: vpn-orchestrator
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Доступ к node-агенту на этом же хосте (network_mode: host у агента):
    # в NODES укажите agent_url = http://host.docker.internal:8080 для локального узла.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Доверенные серты node-агентов (self-signed https-узлы). См. NODE_AGENT_CA_BUNDLE.
    volumes:
      - ./certs:/certs:ro
    # Бот работает через polling (исходящие соединения) — входящий порт не нужен.
    # Раскомментируйте, если нужен доступ к /api/v1/health снаружи:
    # ports:
    #   - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  db:
    image: postgres:15
    container_name: vpn-orchestrator-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpn}
      POSTGRES_DB: ${POSTGRES_DB:-vpn_orchestrator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpn} -d ${POSTGRES_DB:-vpn_orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
